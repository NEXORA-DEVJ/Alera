# ==============================================================================
# ALERA - Configuración de Alto Rendimiento para Redis 7
# Optimizado para Pings GPS Efímeros y Caché de Consultas Sísmicas
# ==============================================================================

# Seguridad y red
bind 0.0.0.0
protected-mode no
requirepass alera_redis_password
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Límite de memoria RAM para proteger el servidor de saturación
maxmemory 512mb

# Política de desalojo: expulsar primero las llaves con TTL que lleven más tiempo sin usarse (LRU)
maxmemory-policy volatile-lru

# Persistencia AOF (Append Only File) cada segundo para no perder estado crítico
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Instantáneas RDB periódicas de respaldo
save 900 1
save 300 10
save 60 1000

# Ajustes de rendimiento en memoria
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Lazy freeing para no congelar hilos de Redis al borrar grandes volúmenes de datos
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes
