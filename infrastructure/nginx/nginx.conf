# ==============================================================================
# ALERA - Configuración de Nginx Reverse Proxy & Gateway Defensivo
# Rate Limiting, Compresión Gzip, Seguridad HTTP y Proxy Reverso hacia Spring Boot
# ==============================================================================

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Optimización de I/O
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Ocultar versión de Nginx ante posibles escaneos de atacantes

    # --- RATE LIMITING DEFENSIVO CONTRA DDOS Y ABUSO ---
    # Zona 1: Tráfico general de la API (15 peticiones por segundo por IP)
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=15r/s;

    # Zona 2: Creación de reportes comunitarios y votos (2 peticiones por segundo por IP)
    limit_req_zone $binary_remote_addr zone=api_reports:10m rate=2r/s;

    # Formato de logs estructurados
    log_format alera_combined '$remote_addr - $remote_user [$time_local] "$request" '
                             '$status $body_bytes_sent "$http_referer" '
                             '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log alera_combined;
    error_log /var/log/nginx/error.log warn;

    # --- COMPRESIÓN GZIP (Acelera respuestas JSON masivas) ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types application/json application/javascript text/plain text/css application/xml;
    gzip_min_length 1024;

    # Upstream hacia el servicio de Spring Boot en la red interna de Docker
    upstream backend_upstream {
        server backend:8085;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Tamaño máximo de cuerpo para subida de fotos de evidencia
        client_max_body_size 15M;

        # --- CABECERAS DEFENSIVAS DE CIBERSEGURIDAD ---
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;" always;

        # 1. Endpoint sensible: Creación de incidentes (Protegido con Rate Limiting estricto)
        location /api/v1/community-incidents {
            limit_req zone=api_reports burst=5 nodelay;

            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Endpoints generales de API (Monitoreo sísmico, consultas de proximidad)
        location /api/ {
            limit_req zone=api_general burst=25 nodelay;

            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Multimedia e imágenes servidas por Spring Boot con caché perimetral
        location /api/v1/media/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # 4. Healthcheck y Actuator
        location /actuator/health {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            access_log off;
        }

        # Página de error por exceso de peticiones (Rate Limit excedido)
        error_page 429 = @rate_limit_exceeded;
        location @rate_limit_exceeded {
            default_type application/json;
            return 429 '{"success":false,"message":"Límite de peticiones excedido por segundo. Por favor reintenta en breve.","status":429}';
        }
    }
}
